<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f7f7f5">
    <title>Skillset — экран</title>
    <link rel="stylesheet" href="screen.css?v=46">
  </head>
  <body>
    <main class="tv-screen">
      <header class="screen-header">
        <img class="school-logo" src="skillset-logo.png" alt="Skillset" width="2172" height="724">
        <div class="screen-datetime">
          <time id="screen-date"></time>
          <time id="screen-clock" aria-label="Текущее время" aria-live="off"></time>
        </div>
      </header>

      <section class="birthday-stage">
        <h1 class="birthday-title" id="birthday-title" hidden>
          <svg class="birthday-gift-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 10h16v10H4z"></path>
            <path d="M3 7h18v4H3z"></path>
            <path d="M12 7v13"></path>
            <path d="M12 7H8.5a2.5 2.5 0 1 1 2.1-3.85L12 7Z"></path>
            <path d="M12 7h3.5a2.5 2.5 0 1 0-2.1-3.85L12 7Z"></path>
          </svg>
          <span>С днём рождения!</span>
        </h1>
        <div id="tv-birthday-list" aria-live="off" aria-label="Информация на экране">
        <article class="tv-person state-card">
          <h1>Загружаем именинников…</h1>
        </article>
        </div>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="screen.js?v=35"></script>
  </body>
</html>
